<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>World Skin Prototype 0.2</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    :root {
      --bg: #020304;
      --panel: rgba(6, 8, 9, 0.72);
      --line: rgba(214, 224, 226, 0.16);
      --line-strong: rgba(234, 241, 242, 0.34);
      --text: #e6ecec;
      --muted: rgba(230, 236, 236, 0.58);
      --faint: rgba(230, 236, 236, 0.32);
      --warm: #d8d0c3;
      --cold: #a7bcc7;
      --stress: #9b4a42;
      --void: #071014;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --map-overlay-darkness: 0.10;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", monospace;
    }

    body {
      display: flex;
      justify-content: center;
    }

    button {
      color: inherit;
      font: inherit;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: none;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 48% 48%, rgba(52, 70, 74, 0.18), transparent 44%),
        #020304;
      isolation: isolate;
    }

    #app::after {
      content: "";
      position: absolute;
      left: 80px;
      right: 12px;
      top: 12px;
      bottom: 12px;
      z-index: 3;
      border: 1px solid rgba(226, 238, 239, 0.14);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(2, 3, 4, 0.28), inset 0 0 46px rgba(2, 3, 4, 0.16);
      opacity: 0;
      transition: opacity 700ms ease;
    }

    #app[data-view="world"]::after,
    #app[data-view="radius"]::after {
      opacity: 1;
    }

    #realMap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0;
      filter: brightness(0.42) contrast(1.55) saturate(0.22);
      transition: opacity 760ms ease;
      background: #090c11;
      touch-action: pan-x pan-y;
    }

    #app.map-ready[data-view="world"] #realMap,
    #app.map-ready[data-view="radius"] #realMap {
      opacity: 1;
    }

    .maplibregl-map {
      background: #090c11;
      font: inherit;
    }

    .maplibregl-canvas {
      outline: none;
    }

    .maplibregl-control-container {
      display: none;
    }

    #mapDarkOverlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: rgba(0, 0, 0, var(--map-overlay-darkness));
      transition: background 180ms linear;
    }

    #skinCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      touch-action: auto;
      cursor: default;
    }

    #app:not(.map-ready) #skinCanvas {
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
    }

    #app.map-ready[data-view="world"] #skinCanvas,
    #app.map-ready[data-view="radius"] #skinCanvas {
      pointer-events: none;
    }

    #app[data-view="sense"] #skinCanvas {
      cursor: default;
    }

    .shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, transparent 42%, rgba(2, 3, 4, 0.08) 100%),
        linear-gradient(to bottom, rgba(2, 3, 4, 0.04), transparent 24%, transparent 78%, rgba(2, 3, 4, 0.10));
      mix-blend-mode: normal;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 18px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 700ms ease;
    }

    #app[data-view="world"] .topbar,
    #app[data-view="radius"] .topbar {
      opacity: 0;
    }

    .identity {
      min-width: 0;
    }

    .kicker {
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--faint);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .title {
      margin-top: 8px;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: var(--text);
      white-space: nowrap;
    }

    .telemetry {
      min-width: 126px;
      text-align: right;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
      letter-spacing: 0.08em;
    }

    .view {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: block;
      opacity: 0;
      visibility: hidden;
      transition: opacity 760ms ease;
      pointer-events: none;
    }

    .view.active {
      opacity: 1;
      visibility: visible;
    }

    #view-sense {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.72fr);
      place-items: stretch;
      padding-left: 84px;
      background:
        linear-gradient(to right, rgba(2, 3, 4, 0.72), rgba(2, 3, 4, 0.2)),
        radial-gradient(circle at 31% 50%, rgba(112, 151, 166, 0.14), transparent 38%);
    }

    .sense-wrap {
      width: 100%;
      min-height: 100%;
      position: relative;
      pointer-events: auto;
      display: grid;
      place-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .press-target {
      width: min(48vw, 460px);
      max-width: 460px;
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      position: relative;
      display: grid;
      place-items: center;
      touch-action: none;
      --breath-scale: 1;
    }

    .breath-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      border: 1px solid rgba(238, 246, 246, 0.22);
      transform: translate(-50%, -50%) scale(var(--breath-scale));
      transition: transform 900ms cubic-bezier(0.4, 0, 0.2, 1), opacity 900ms ease, border-color 900ms ease;
      pointer-events: none;
      box-shadow: 0 0 26px rgba(226, 238, 239, 0.08);
    }

    .breath-ring.r1 {
      width: 35%;
      height: 35%;
      opacity: 0.72;
      border-color: rgba(245, 249, 249, 0.58);
    }

    .breath-ring.r2 {
      width: 55%;
      height: 55%;
      opacity: 0.5;
      transform: translate(-50%, -50%) scale(calc(var(--breath-scale) * 0.96));
    }

    .breath-ring.r3 {
      width: 76%;
      height: 76%;
      opacity: 0.32;
      transform: translate(-50%, -50%) scale(calc(var(--breath-scale) * 0.91));
    }

    .breath-ring.r4 {
      width: 95%;
      height: 95%;
      opacity: 0.18;
      transform: translate(-50%, -50%) scale(calc(var(--breath-scale) * 0.86));
    }
    .breath-ring.r5 {
      width: 115%;
      height: 115%;
      opacity: 0.11;
      transform: translate(-50%, -50%) scale(calc(var(--breath-scale) * 0.80));
    }
    .breath-ring.r6 {
      width: 136%;
      height: 136%;
      opacity: 0.07;
      transform: translate(-50%, -50%) scale(calc(var(--breath-scale) * 0.74));
    }
    .breath-ring.r7 {
      width: 158%;
      height: 158%;
      opacity: 0.04;
      transform: translate(-50%, -50%) scale(calc(var(--breath-scale) * 0.68));
    }

    .press-target.recording .breath-ring {
      border-color: rgba(250, 252, 252, 0.82);
      box-shadow: 0 0 36px rgba(232, 242, 243, 0.16);
    }

    .sense-core {
      position: relative;
      width: 42%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(236, 244, 244, 0.32);
      background: radial-gradient(circle, rgba(240, 247, 247, 0.12), rgba(240, 247, 247, 0.02) 54%, transparent 72%);
      transition: opacity 700ms ease, transform 900ms cubic-bezier(0.4, 0, 0.2, 1);
      transform: scale(calc(0.88 + (var(--breath-scale) - 1) * 0.55));
      z-index: 1;
    }

    .sense-percent {
      font-size: 18px;
      letter-spacing: 0.06em;
      display: none;
    }

    .sense-state {
      position: absolute;
      bottom: 15%;
      width: 100%;
      left: 0;
      text-align: center;
      color: rgba(232, 240, 241, 0.72);
      font-size: 13px;
      letter-spacing: 0.12em;
      line-height: 1.75;
      opacity: 1;
      transition: opacity 700ms ease, color 700ms ease;
      pointer-events: none;
    }

    .radius-panel {
      position: absolute;
      left: auto;
      right: 18px;
      top: 18px;
      bottom: auto;
      width: min(34vw, 320px);
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 18px;
      pointer-events: auto;
      overflow: auto;
      scrollbar-width: none;
      max-height: calc(100dvh - 36px);
      padding: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(12, 17, 18, 0.9), rgba(3, 5, 6, 0.66));
      backdrop-filter: blur(18px);
      opacity: 0;
      transform: translateX(calc(100% + 28px));
      transition: opacity 620ms ease, transform 620ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .radius-panel::-webkit-scrollbar {
      display: none;
    }

    #view-radius.active .radius-panel {
      opacity: 0;
      transform: translateX(calc(100% + 28px));
    }

    #view-radius.active .radius-panel.open {
      opacity: 1;
      transform: translateX(0);
    }

    .radius-toggle {
      position: absolute;
      right: 24px;
      bottom: calc(110px + var(--safe-bottom));
      z-index: 5;
      transform: none;
      min-width: 118px;
      height: 36px;
      border: 1px solid rgba(226, 238, 239, 0.22);
      background: rgba(3, 5, 6, 0.58);
      color: rgba(232, 240, 241, 0.68);
      backdrop-filter: blur(14px);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease, transform 500ms ease;
      cursor: pointer;
    }

    #view-radius.active .radius-toggle {
      opacity: 1;
      pointer-events: auto;
    }

    #view-radius.active .radius-panel.open + .radius-toggle {
      transform: translateX(-330px);
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .metric {
      min-height: 82px;
      padding: 12px;
      background: rgba(5, 7, 8, 0.76);
    }

    .metric-value {
      font-size: 22px;
      letter-spacing: 0.04em;
    }

    .metric-label {
      margin-top: 8px;
      color: var(--faint);
      font-size: 10px;
      letter-spacing: 0.1em;
      line-height: 1.45;
    }

    .section-title {
      color: var(--faint);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .time-slice {
      display: grid;
      gap: 10px;
    }

    .slice {
      display: grid;
      grid-template-columns: 68px 1fr 34px;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--muted);
    }

    .track {
      height: 2px;
      background: rgba(232, 242, 243, 0.12);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0;
      background: rgba(232, 242, 243, 0.8);
      box-shadow: 0 0 18px rgba(232, 242, 243, 0.28);
      transition: width 360ms ease;
    }

    .tag-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .tag-cell {
      min-height: 52px;
      display: grid;
      place-items: center;
      background: rgba(5, 7, 8, 0.78);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .tag-cell.active {
      color: var(--text);
      background: rgba(221, 231, 232, 0.1);
    }

    .footer-nav {
      position: absolute;
      left: 12px;
      right: auto;
      top: 12px;
      bottom: 12px;
      z-index: 8;
      width: 68px;
      height: auto;
      border: 1px solid var(--line);
      background: rgba(3, 5, 6, 0.64);
      backdrop-filter: blur(18px);
      display: grid;
      grid-template-rows: repeat(3, minmax(82px, 1fr));
      grid-template-columns: 1fr;
      transition: opacity 700ms ease;
    }

    #app[data-view="world"] .footer-nav,
    #app[data-view="radius"] .footer-nav {
      opacity: 0.56;
      border-color: transparent;
      background: transparent;
      backdrop-filter: none;
    }

    .nav-btn {
      border: 0;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      color: var(--faint);
      display: grid;
      place-items: center;
      gap: 4px;
      padding: 8px 4px;
      transition: color 500ms ease, background 500ms ease, opacity 500ms ease;
    }

    #app[data-view="world"] .nav-btn,
    #app[data-view="radius"] .nav-btn {
      border-bottom-color: rgba(226, 238, 239, 0.1);
    }

    .nav-btn:last-child {
      border-bottom: 0;
    }

    .nav-btn.active {
      color: #bcd8ff;
      background: radial-gradient(circle, rgba(136, 173, 255, 0.18), transparent 62%);
    }

    .nav-mark {
      width: 25px;
      height: 25px;
      position: relative;
    }

    .nav-mark.skin::before,
    .nav-mark.sense::before,
    .nav-mark.radius::before {
      content: "";
      position: absolute;
      inset: 3px;
      border: 1px solid currentColor;
      opacity: 0.86;
    }

    .nav-mark.skin::before {
      border-radius: 42% 58% 46% 54%;
    }

    .nav-mark.sense::before {
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(230, 236, 236, 0.06);
    }

    .nav-mark.radius::before {
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .nav-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      display: block;
    }

    .modal {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(1, 2, 3, 0);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 800ms ease, background 800ms ease;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
      background: rgba(1, 2, 3, 0.56);
    }

    .record-panel {
      position: relative;
      width: min(86vw, 360px);
      aspect-ratio: 1;
      border: 0;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
    }

    .panel-title {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text);
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      display: none;
    }

    .readout {
      margin-top: 18px;
      display: grid;
      gap: 14px;
      display: none;
    }

    .readout-row {
      display: grid;
      grid-template-columns: 96px 1fr 44px;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .label-select {
      position: absolute;
      inset: 0;
      margin-top: 0;
      display: block;
      border: 0;
      background: transparent;
    }

    .label-btn {
      position: absolute;
      min-width: 72px;
      min-height: 44px;
      border: 0;
      background: transparent;
      color: rgba(232, 240, 241, 0.72);
      cursor: pointer;
      font-size: 20px;
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.96);
      animation: wordFloat 900ms ease forwards;
      text-shadow: 0 0 18px rgba(232, 240, 241, 0.16);
    }

    .label-btn.selected {
      background: transparent;
      color: var(--text);
    }

    .label-btn.skip {
      font-size: 12px;
      color: rgba(232, 240, 241, 0.44);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    @keyframes wordFloat {
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes promptFade {
      from { opacity: 0; transform: translateX(-50%) translateY(4px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .sense-round-prompt {
      position: absolute;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(232, 240, 241, 0.52);
      font-size: 11px;
      letter-spacing: 0.14em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      animation: promptFade 700ms ease forwards;
    }

    .panel-actions {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      border: 1px solid var(--line-strong);
      background: var(--line-strong);
      display: none;
    }

    .action-btn {
      min-height: 48px;
      border: 0;
      background: rgba(5, 7, 8, 0.98);
      cursor: pointer;
      color: var(--text);
      font-size: 11px;
      letter-spacing: 0.14em;
    }

    .action-btn.dim {
      color: var(--faint);
    }

    .utility {
      position: absolute;
      right: 18px;
      top: 18px;
      bottom: auto;
      z-index: 7;
      display: grid;
      gap: 8px;
      pointer-events: auto;
      transition: opacity 700ms ease;
    }

    #app[data-view="world"] .utility {
      opacity: 1;
      pointer-events: auto;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      background: rgba(4, 6, 7, 0.66);
      backdrop-filter: blur(12px);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--muted);
    }

    .icon-btn:hover {
      color: var(--text);
    }

    .toast {
      position: absolute;
      left: 18px;
      right: 18px;
      top: calc(84px + env(safe-area-inset-top, 0px));
      z-index: 30;
      display: none;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: rgba(3, 5, 6, 0.86);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      letter-spacing: 0.06em;
      backdrop-filter: blur(12px);
    }

    .toast.active {
      display: block;
    }

    #app[data-view="world"] .toast,
    #app[data-view="radius"] .toast {
      display: none;
    }

    .debug-panel {
      position: absolute;
      left: 92px;
      top: 18px;
      z-index: 12;
      display: none;
      width: 248px;
      padding: 12px 14px;
      border: 1px solid rgba(226, 238, 239, 0.22);
      background: rgba(2, 4, 5, 0.78);
      color: rgba(232, 240, 241, 0.72);
      font-size: 10px;
      line-height: 1.65;
      letter-spacing: 0.06em;
      backdrop-filter: blur(12px);
      pointer-events: none;
      white-space: pre;
    }

    .debug-panel.active {
      display: block;
    }

    .time-axis {
      position: absolute;
      left: 96px;
      right: 96px;
      bottom: calc(18px + var(--safe-bottom));
      z-index: 6;
      padding: 12px 16px 10px;
      border: 1px solid rgba(226, 238, 239, 0.2);
      background: rgba(3, 5, 6, 0.68);
      backdrop-filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease;
    }

    #app[data-view="world"] .time-axis {
      opacity: 1;
      pointer-events: auto;
    }

    .time-axis-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(232, 240, 241, 0.72);
      font-size: 11px;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .time-axis input[type="range"] {
      width: 100%;
      accent-color: #edf6f6;
    }

    .time-ticks {
      display: flex;
      justify-content: space-between;
      color: rgba(232, 240, 241, 0.36);
      font-size: 9px;
      letter-spacing: 0.08em;
      margin-top: 5px;
    }

    @media (min-width: 720px) {
      #app {
        margin: 0 auto;
        box-shadow: none;
      }
    }

    @media (max-width: 720px) {
      #app {
        max-width: none;
      }

      #view-sense {
        grid-template-columns: 1fr;
        padding-left: 0;
      }

      .press-target {
        width: min(76vw, 340px);
      }

      .footer-nav {
        left: 12px;
        right: 12px;
        top: auto;
        bottom: calc(12px + var(--safe-bottom));
        width: auto;
        height: 64px;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 1fr;
      }

      #app::after {
        left: 12px;
        right: 12px;
        top: 12px;
        bottom: calc(88px + var(--safe-bottom));
      }

      .nav-btn {
        border-bottom: 0;
        border-right: 1px solid var(--line);
      }

      .nav-btn:last-child {
        border-right: 0;
      }

      .time-axis {
        left: 18px;
        right: 18px;
        bottom: calc(96px + var(--safe-bottom));
      }

      .radius-panel {
        left: 18px;
        right: 18px;
        top: auto;

      function maybeSeedPersonalRecords(records) {
        const alreadySeeded = !!localStorage.getItem(SEED_KEY);
        if (alreadySeeded && records.length > 0) return records;
        const source = window.MY_SKIN_DATA?.records || [];
        if (!source.length) return records;
        try {
          const seeded = source.map(r => ({
            ...r,
            noise: r.noiseLevel,
            flux: r.turbulence,
            movement: r.mobility,
            slot: r.hour < 6 ? "night" : r.hour < 12 ? "morning" : r.hour < 18 ? "day" : r.hour < 22 ? "evening" : "night",
            createdAt: r.timestamp
          }));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
          localStorage.setItem(SEED_KEY, "1");
          console.log("[WorldSkin] seeded", seeded.length, "personal records");
          return seeded;
        } catch {
          return records;
        }
      }

      function metersToLatLng(dx, dy, origin = WORLD_ORIGIN) {
        return {
          lat: origin.lat + dy / 111320,
          lng: origin.lng + dx / (111320 * Math.cos(origin.lat * Math.PI / 180))
        };
      }

      function latLngToMeters(pos, origin = WORLD_ORIGIN) {
        return {
          dx: (pos.lng - origin.lng) * 111320 * Math.cos(origin.lat * Math.PI / 180),
          dy: (pos.lat - origin.lat) * 111320
        };
      }

      function activeRecords() {
        if (state.view === "world") {
          return state.personalRecords.length
            ? [...state.worldRecords, ...state.personalRecords]
            : state.worldRecords;

      function activeOrigin() {

      function recordNoise(record) {
        return clamp(Number(record.noise ?? record.noiseLevel ?? 0.18), 0, 1);
      }

      function recordFlux(record) {
        return clamp(Number(record.flux ?? record.turbulence ?? 0.08), 0, 1);
      }

      function recordMove(record) {
        const move = record.movement ?? record.mobility ?? "still";
        return ["still", "slow", "passing"].includes(move) ? move : "still";
      }

      function recordTime(record) {
        return record.createdAt ?? record.timestamp ?? new Date().toISOString();
      }

      function recordSlot(record) {
        if (record.slot) return record.slot;
        const hour = Number.isFinite(record.hour) ? record.hour : new Date(recordTime(record)).getHours();
        if (hour >= 5 && hour < 11) return "morning";
        if (hour >= 11 && hour < 17) return "day";
        if (hour >= 17 && hour < 22) return "evening";
        return "night";
      }

      // ── v2 record field accessors (safe fallback for old records) ────────
      function getSV(rec) {
        if (rec.senseVector) return rec.senseVector;
        return { spaciousness: 0, gravity: 0, tension: 0, flow: 0 };
      }

      function getTexMod(rec) {
        if (rec.textureModifier) return rec.textureModifier;
        return { warmth: 0, roughness: 0, clarity: 0, dryness: 0 };
      }

      function getSoundV(rec) {
        if (rec.soundVector) return rec.soundVector;
        const loudness   = clamp(Number(rec.noise ?? rec.noiseLevel ?? 0.18), 0, 1);
        const turbulence = clamp(Number(rec.flux  ?? rec.turbulence  ?? 0.08), 0, 1);
        return { loudness, turbulence, sharpness: 0.3, continuity: 0.8, texture: 0.3 };
      }

      // ── soundVector computation from mic samples ──────────────────────────
      function _spectralSharpness(freq) {
        if (!freq || !freq.length) return 0.3;
        const n = freq.length, hiStart = Math.floor(n * 0.5);
        let total = 0, hi = 0;
        for (let i = 0; i < n; i++) { total += freq[i]; if (i >= hiStart) hi += freq[i]; }
        return total > 0 ? hi / total : 0.3;
      }

      function _spectralSpread(freq) {
        if (!freq || !freq.length) return 0.3;
        const n = freq.length;
        let sum = 0, sum2 = 0;
        for (let i = 0; i < n; i++) { const v = freq[i] / 255; sum += v; sum2 += v * v; }
        const mean = sum / n;
        return clamp((sum2 / n - mean * mean) * 4, 0, 1);
      }

      function computeSoundVector(samples) {
        if (!samples.length) return { loudness: 0.18, turbulence: 0.08, sharpness: 0.3, continuity: 0.8, texture: 0.3 };
        const vols = samples.map(s => s.volume);
        const loudness   = vols.reduce((a, b) => a + b, 0) / vols.length;
        const turbulence = clamp(Math.max(...vols) - Math.min(...vols), 0, 1);
        const sharpness  = samples.reduce((a, s) => a + (s.sharpness  ?? 0.3), 0) / samples.length;
        const texture    = samples.reduce((a, s) => a + (s.texture    ?? 0.3), 0) / samples.length;
        const continuity = samples.filter(s => s.volume > 0.05).length / samples.length;
        return {
          loudness:   clamp(loudness,   0, 1),
          turbulence: clamp(turbulence, 0, 1),
          sharpness:  clamp(sharpness,  0, 1),
          continuity: clamp(continuity, 0, 1),
          texture:    clamp(texture,    0, 1),
        };
      }

      function pickRoundWords(seenWords) {
        const available = SENSE_WORD_LIST.filter(e => !seenWords.includes(e.word));
        const shuffled = [...available].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 3).map(e => e.word);
      }

      function recordBaseVisual(record) {
        const noise = recordNoise(record);
        const flux = recordFlux(record);
        const peak = clamp(Number(record.peak ?? 0.18), 0, 1);
        const movement = recordMove(record);
        const slot = recordSlot(record);
        const sv = getSV(record);
        const activeSlot = slot === "day" ? 0.08 : slot === "evening" ? 0.02 : slot === "night" ? -0.12 : -0.03;
        const movementFlux = movement === "passing" ? 0.08 : movement === "slow" ? 0.03 : -0.02;
        const movementSpread = movement === "passing" ? 0.08 : movement === "slow" ? 0.03 : -0.02;
        return {
          strength: clamp(0.04 + noise * 0.38 + peak * 0.16 + (movement === "still" ? 0.03 : 0), 0.04, VISUAL_LIMITS.strength),
          flux: clamp(flux + movementFlux, 0, VISUAL_LIMITS.flux),
          contrast: clamp(flux * 0.2 + peak * 0.14 + (noise > 0.65 ? 0.04 : 0), 0, VISUAL_LIMITS.contrast),
          warmth: clamp(activeSlot + (noise - 0.5) * 0.08, -0.35, 0.35),
          spread: clamp(0.9 + noise * 0.16 + movementSpread + sv.spaciousness * 0.18, 0.65, 1.35),
          boundary: clamp(flux * 0.16 + (movement === "passing" ? 0.04 : 0), 0, VISUAL_LIMITS.boundaryAlpha),
          breathSpeed: clamp(1 - flux * 0.08 + (slot === "night" ? -0.06 : 0), 0.65, 1.2),
          radiusBias: clamp((noise - 0.45) * 0.18 + peak * 0.08, -0.16, 0.28),
          heightBias: clamp((noise - 0.45) * 16 + peak * 8, -12, 18),
          senseSpacious: sv.spaciousness,
          senseGravity: sv.gravity,
        };
      }

      function mixColor(a, b, amount) {
        const t = clamp(amount, 0, 1);
        return {
          r: Math.round(a.r + (b.r - a.r) * t),
          g: Math.round(a.g + (b.g - a.g) * t),
          b: Math.round(a.b + (b.b - a.b) * t)
        };
      }

      function getDotAlpha(params) {
        const s = clamp(params.strength, 0, 1);
        const c = clamp(params.contrast, 0, 1);
        const b = clamp(params.boundary, 0, 1);
        const f = clamp(params.flux, 0, 1);
        if (s < GRID_VISUAL.strengthCutoff) return clamp(0.012 + c * 0.035, GRID_VISUAL.minAlpha, 0.045);
        return clamp(
          0.018 +
          Math.pow(s, 1.18) * 0.48 +
          Math.pow(c, 1.05) * 0.16 +
          Math.pow(b, 1.05) * 0.14 +
          Math.pow(f, 1.2) * 0.08,
          GRID_VISUAL.minAlpha,
          GRID_VISUAL.maxAlpha
        );
      }

      function getDotRadius(params) {
        const s = clamp(params.strength, 0, 1);
        const f = clamp(params.flux, 0, 1);
        const b = clamp(params.boundary, 0, 1);
        // spacious(+1)→smaller dots; dense(-1)→larger dots
        const spBias = clamp(-(params.senseSpacious ?? 0) * 2, -2, +2);
        return clamp(
          DOT_DENSITY_VISUAL.baseRadiusPx +
          Math.pow(s, 1.25) * 0.75 +
          Math.pow(f, 1.4) * 0.18 +
          b * 0.12 +
          (params.radiusBias || 0) +
          spBias,
          DOT_DENSITY_VISUAL.minRadiusPx,
          DOT_DENSITY_VISUAL.maxRadiusPx
        );
      }

      function getDotColor(params) {
        const s = clamp(params.strength, 0, 1);
        const w = clamp(params.warmth, -0.35, 0.35);
        if (s < GRID_VISUAL.strengthCutoff) return GRID_VISUAL.colors.void;
        const coldT = Math.pow(Math.abs(w) / 0.35, 0.58);
        const warmT = Math.pow(w / 0.35, 0.58);
        let color = w < 0
          ? mixColor(GRID_VISUAL.colors.neutral, GRID_VISUAL.colors.cold, coldT)
          : mixColor(GRID_VISUAL.colors.neutral, GRID_VISUAL.colors.warm, warmT);
        const brightTarget = w < 0 ? GRID_VISUAL.colors.bright : GRID_VISUAL.colors.warmBright;
        color = mixColor(color, brightTarget, clamp(s * 0.38, 0, 0.50));
        return color;
      }

      function getDotHeight(params) {
        // gravity only: heavy(+1)→raised, light(-1)→flat; record density has no effect
        const g = clamp(params.senseGravity ?? 0, -1, 1);
        return clamp(58 + g * 100, 4, 126);
      }

      function temporalWeight(record) {
        if (state.view !== "world") return 1;
        const date = new Date(recordTime(record));
        const hour = Number.isFinite(record.hour) ? record.hour : date.getUTCHours();
        const day = Math.floor((date.getTime() - Date.UTC(2026, 4, 4)) / 86400000);
        const selectedHour = state.selectedHour;
        const hourDiff = Math.min(Math.abs(hour - selectedHour), 24 - Math.abs(hour - selectedHour));
        const hourWeight = Math.exp(-(hourDiff * hourDiff) / (2 * 1.55 * 1.55));
        const dayWeight = day === 6 ? 1 : 0.35;
        const threeDayWeight = day >= 4 ? 1 : 0.45;
        const weekWeight = 1;
        const monthWeight = 0.55;
        const a = state.aggregation;
        return a.hour * hourWeight + a.day * dayWeight + a.threeDay * threeDayWeight + a.week * weekWeight + a.month * monthWeight;
      }
